<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Tareas y Categorías</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SortableJS -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <!-- PapaParse for CSV -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        .sortable-ghost {
            opacity: 0.4;
            background-color: #f3f4f6;
        }
        .task-expand-enter {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
        }
        .task-expand-enter-active {
            max-height: 500px;
        }
        .task-expand-leave {
            max-height: 500px;
            overflow: hidden;
            transition: max-height 0.3s ease-in;
        }
        .task-expand-leave-active {
            max-height: 0;
        }
        /* Custom scrollbar for better look */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* Indicators Circular Progress */
        .circular-progress {
            position: relative;
            width: 48px;
            height: 48px;
        }
        .circular-progress svg {
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }
        .circular-progress circle {
            fill: none;
            stroke-width: 4;
            stroke-linecap: round;
        }
        #btn-combined-indicator .circular-progress circle {
            stroke-width: 2;
        }
        .circular-progress .bg-circle {
            stroke: #e2e8f0; /* tailwind slate-200 */
        }
        .circular-progress .progress-circle {
            stroke: #4f46e5; /* tailwind indigo-600 */
            stroke-dasharray: 125.6; /* 2 * pi * r (r=20) */
            stroke-dashoffset: 125.6; /* Will be updated via JS */
            transition: stroke-dashoffset 0.5s ease, opacity 0.3s ease;
        }
        .circular-progress .value {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 0.75rem;
            font-weight: bold;
            color: #1f2937;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            line-height: 1.1;
        }
        .circular-progress .value .val-small {
            font-size: 0.5rem;
            color: #94a3b8;
            font-weight: normal;
        }
        .circular-progress .value .val-active {
            font-size: 0.75rem;
            font-weight: bold;
            color: #1f2937;
        }

        /* Delete Mode active */
        body.delete-mode-active .delete-btn-large {
            display: inline-block !important;
        }

        /* Filter Bar Animation */
        #filter-bar {
            transition: all 0.3s ease-in-out;
            max-height: 500px;
            opacity: 1;
            overflow: visible;
        }
        #filter-bar.filters-hidden {
            max-height: 0;
            padding-top: 0;
            padding-bottom: 0;
            margin-top: 0;
            margin-bottom: 0;
            opacity: 0;
            overflow: hidden;
            pointer-events: none;
        }

        /* Overlapping Stars Priority Component */
        .stars-priority {
            display: inline-flex;
            align-items: center;
            cursor: pointer;
            user-select: none;
            vertical-align: middle;
        }
        .stars-priority .star {
            position: relative;
            margin-right: -0.6em; /* Overlap amount */
            transition: transform 0.1s;
            pointer-events: none; /* Let parent handle clicks/longpress */
            text-shadow:
                -1px -1px 0 #555,
                 1px -1px 0 #555,
                -1px  1px 0 #555,
                 1px  1px 0 #555;
        }
        .stars-priority .star:last-child {
            margin-right: 0;
        }
        /* Stacking order: left stars on top of right stars */
        .stars-priority .star:nth-child(1) { z-index: 5; }
        .stars-priority .star:nth-child(2) { z-index: 4; }
        .stars-priority .star:nth-child(3) { z-index: 3; }
        .stars-priority .star:nth-child(4) { z-index: 2; }
        .stars-priority .star:nth-child(5) { z-index: 1; }

        .stars-priority.size-sm .star {
            font-size: 0.85rem;
            margin-right: -0.5em;
        }
        .stars-priority.size-md .star {
            font-size: 1.25rem;
        }

        .star-yellow { color: #fbbf24; } /* tailwind yellow-400 */
        .star-gray { color: #d1d5db; } /* tailwind gray-300 */

        /* Hide numeric input by default in the stars component */
        .stars-priority .priority-numeric-input {
            display: none;
            width: 50px;
            padding: 2px;
            font-size: 0.875rem;
            border: 1px solid #d1d5db;
            border-radius: 4px;
        }
        .stars-priority.edit-mode .star-container {
            display: none !important;
        }
        .stars-priority.edit-mode .priority-numeric-input {
            display: inline-block;
        }

        /* Attachment Styles */
        .attachment-container {
            width: 135px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background-color: #f8fafc;
            border-radius: 4px;
            border: 1px solid #e2e8f0;
        }
        .attachment-placeholder {
            width: 100%;
            height: 100%;
            border: 2px dashed #94a3b8;
            background-color: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: 600;
            color: #475569;
            cursor: pointer;
            text-align: center;
            line-height: 1.2;
            padding: 2px;
            transition: all 0.2s;
        }
        .attachment-placeholder:hover {
            background-color: #e2e8f0;
            border-color: #64748b;
        }
        .attachment-image {
            max-width: 135px;
            max-height: 45px;
            width: auto;
            height: auto;
            cursor: pointer;
            object-fit: contain;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen flex flex-col">

    <!-- Top Action Bar -->
    <div class="bg-gray-800 text-white py-2 px-4 flex justify-between items-center text-sm sticky top-0 z-20 shadow overflow-x-hidden">
        <div class="flex items-center space-x-2 sm:space-x-4">
            <span class="font-bold tracking-wider text-gray-300 hidden sm:inline">Gestor</span>
            <button id="btn-import-csv" class="text-indigo-300 hover:text-indigo-100 transition flex items-center" title="Import">
                <i class="fas fa-file-import sm:mr-1"></i> <span class="hidden md:inline">Import</span>
            </button>
            <button id="btn-export-csv" class="text-indigo-300 hover:text-indigo-100 transition flex items-center" title="Export">
                <i class="fas fa-file-export sm:mr-1"></i> <span class="hidden md:inline">Export</span>
            </button>
            <button id="btn-view-deleted" class="text-indigo-300 hover:text-indigo-100 transition flex items-center" title="Restaurar">
                <i class="fas fa-trash-restore sm:mr-1"></i> <span class="hidden md:inline">Restaurar</span>
            </button>
            <button id="btn-toggle-delete-mode" class="text-indigo-300 hover:text-indigo-100 transition flex items-center" title="Borrar">
                <i class="fas fa-trash-alt sm:mr-1"></i> <span class="hidden md:inline">Borrar</span>
            </button>
            <button id="btn-add-category" class="text-indigo-300 hover:text-indigo-100 transition flex items-center" title="Añadir">
                <i class="fas fa-folder-plus sm:mr-1"></i> <span class="hidden md:inline">Añadir</span>
            </button>
        </div>
        <div class="flex items-center space-x-2">
            <button id="btn-toggle-all-categories" class="text-indigo-300 hover:text-indigo-100 transition flex items-center sm:mr-4" title="Expandir/Contraer">
                <i class="fas fa-compress-arrows-alt sm:mr-1"></i> <span class="hidden md:inline">Expandir/Contraer</span>
            </button>
            <button id="btn-toggle-list-view" class="text-indigo-300 hover:text-indigo-100 transition flex items-center sm:mr-4" title="Alternar Vista">
                <i class="fas fa-list sm:mr-1"></i> <span class="hidden md:inline">Listado</span>
            </button>
            <button id="btn-toggle-filters" class="text-indigo-300 hover:text-indigo-100 transition flex items-center" title="Filtro">
                <i class="fas fa-filter sm:mr-1"></i> <span class="hidden md:inline">Filtro</span>
            </button>
        </div>
    </div>

    <!-- Header / Filters -->
    <header id="filter-bar" class="bg-white shadow-md py-4 px-6 flex flex-col md:flex-row justify-between items-start md:items-center z-10 gap-4">

        <!-- Left Side: Title and Search -->
        <div class="flex items-center space-x-4 flex-grow max-w-xl">
            <button id="btn-toggle-indicators" class="text-xl font-bold text-indigo-700 flex-shrink-0 hover:text-indigo-500 transition focus:outline-none" title="Mostrar/Ocultar Indicadores">
                <i class="fas fa-tasks fa-lg"></i>
            </button>

            <div class="relative flex-grow">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3">
                    <i class="fas fa-search text-gray-400"></i>
                </span>
                <input type="text" id="filter-search" placeholder="Buscar por nombre..." class="w-full pl-10 pr-3 py-2 border border-gray-300 rounded focus:ring-indigo-500 focus:border-indigo-500 text-sm">
            </div>

            <div class="flex items-center flex-shrink-0 space-x-2">
                <label class="text-gray-600 font-semibold" title="Prioridad mínima"></label>
                <div class="priority-stars-container size-md" id="filter-priority-stars"></div>
            </div>
        </div>

        <!-- Right Side: Indicators -->
        <div id="indicators-container" class="flex items-center space-x-3 overflow-x-auto pb-1 md:pb-0 transition-all duration-300 md:flex-grow md:justify-end">
            <!-- Indicator: Combined (Totals, Pendientes, Completadas) -->
            <button id="btn-combined-indicator" class="flex flex-col items-center group focus:outline-none transition-all" title="Totales / Pendientes / Completadas">
                <div class="circular-progress">
                    <svg viewBox="0 0 48 48">
                        <circle cx="24" cy="24" r="21" class="bg-circle"></circle>
                        <circle cx="24" cy="24" r="21" class="progress-circle" id="ind-total-circle" style="stroke-dasharray: 131.95; stroke-dashoffset: 131.95;"></circle>
                        <circle cx="24" cy="24" r="19" class="progress-circle stroke-amber-500" id="ind-pending-circle" style="stroke-dasharray: 119.38; stroke-dashoffset: 119.38;"></circle>
                        <circle cx="24" cy="24" r="17" class="progress-circle stroke-emerald-500" id="ind-done-circle" style="stroke-dasharray: 106.81; stroke-dashoffset: 106.81;"></circle>
                    </svg>
                    <div class="value" id="combined-val-container">
                        <span id="ind-total-val" class="val-small">0</span>
                        <span id="ind-pending-val" class="val-active">0</span>
                        <span id="ind-done-val" class="val-small">0</span>
                    </div>
                </div>
                <span id="combined-label" class="text-[10px] font-semibold text-gray-500 group-hover:text-indigo-600 mt-1">Pendientes</span>
            </button>

            <!-- Secondary Filter Select -->
            <select id="secondary-filter-select" class="w-12 h-12 bg-blue-600 text-white text-[9px] rounded shadow-sm focus:outline-none appearance-none text-center cursor-pointer border-none" title="Filtro secundario">
                <option value="all">- 0</option>
                <option value="progressive">Progresivas 0</option>
                <option value="scheduled">Programadas 0</option>
                <option value="forecast">Previsión 0</option>
            </select>
        </div>
    </header>

    <!-- Main Board -->
    <main class="flex-grow p-4 md:p-6 flex flex-col">
        <!-- Grid Container for columns (responsive, no horizontal scroll) -->
        <div id="board" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-5 gap-4 md:gap-6 items-start h-full">
            <!-- Categories will be rendered here by JS -->
        </div>
    </main>

    <!-- Hidden Inputs for File Uploads -->
    <input type="file" id="file-upload" accept=".csv" class="hidden">
    <input type="file" id="attachment-upload" accept="image/*" class="hidden">

    <!-- Modal for CSV Import Options -->
    <div id="modal-import" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-lg p-6 w-96 shadow-xl">
            <h2 class="text-xl font-bold mb-4">Opciones de Importación</h2>
            <p class="text-sm text-gray-600 mb-6">Elige cómo deseas importar los datos del archivo CSV.</p>
            <div class="flex flex-col space-y-3">
                <button id="btn-import-merge" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded shadow transition">
                    Añadir y Unificar
                </button>
                <button id="btn-import-overwrite" class="bg-red-600 hover:bg-red-500 text-white px-4 py-2 rounded shadow transition">
                    Borrar Todo y Sobrescribir
                </button>
                <button id="btn-import-cancel" class="bg-gray-300 hover:bg-gray-400 text-gray-800 px-4 py-2 rounded shadow transition mt-4">
                    Cancelar
                </button>
            </div>
        </div>
    </div>

    <!-- Modal for History -->
    <div id="modal-history" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-lg p-6 w-3/4 max-w-2xl max-h-[80vh] flex flex-col shadow-xl">
            <div class="flex justify-between items-center mb-4 border-b pb-2">
                <h2 class="text-xl font-bold text-gray-800"><i class="fas fa-history mr-2 text-indigo-500"></i> Historial</h2>
                <button id="btn-close-history" class="text-gray-500 hover:text-gray-800"><i class="fas fa-times fa-lg"></i></button>
            </div>
            <div class="flex-grow flex flex-col space-y-4">
                <textarea id="history-textarea" class="w-full flex-grow border border-gray-300 rounded p-3 text-sm focus:ring-indigo-500 focus:border-indigo-500" placeholder="Escribe el historial aquí..."></textarea>
                <div class="flex justify-end">
                    <button id="btn-save-history" class="bg-indigo-600 hover:bg-indigo-500 text-white px-6 py-2 rounded shadow transition font-medium">
                        Guardar
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal for Attachment Full View -->
    <div id="modal-attachment-view" class="fixed inset-0 bg-black bg-opacity-90 flex items-center justify-center z-[60] hidden">
        <div class="relative max-w-full max-h-full p-4 flex items-center justify-center">
            <button id="btn-close-attachment-view" class="absolute top-4 right-4 text-white hover:text-gray-300 z-10 bg-black bg-opacity-50 rounded-full w-10 h-10 flex items-center justify-center">
                <i class="fas fa-times fa-lg"></i>
            </button>
            <img id="attachment-full-image" src="" alt="Vista completa" class="max-w-full max-h-[90vh] object-contain">
        </div>
    </div>

    <!-- Modal for Deleted Items -->
    <div id="modal-deleted" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-lg p-6 w-3/4 max-w-4xl max-h-[80vh] flex flex-col shadow-xl">
            <div class="flex justify-between items-center mb-4 border-b pb-2">
                <h2 class="text-xl font-bold text-gray-800"><i class="fas fa-trash-alt mr-2 text-red-500"></i> Elementos Borrados</h2>
                <button id="btn-close-deleted" class="text-gray-500 hover:text-gray-800"><i class="fas fa-times fa-lg"></i></button>
            </div>
            <div class="flex-grow overflow-y-auto pr-2" id="deleted-items-container">
                <!-- Deleted items will be rendered here -->
            </div>
        </div>
    </div>

    <!-- Template for Category -->
    <template id="tpl-category">
        <div class="category-column bg-gray-200 rounded-lg shadow-sm flex flex-col w-full max-h-full" data-id="">
            <!-- Category Header -->
            <div class="category-header p-2 flex justify-between items-center border-b border-gray-300 bg-gray-200 rounded-t-lg">
                <button class="btn-toggle-category text-gray-500 hover:text-gray-800 transition px-2 flex flex-col items-center justify-center shrink-0">
                    <span class="category-task-count text-sm font-bold leading-none">0</span>
                    <i class="fas fa-chevron-down text-[8px] mt-0.5 opacity-70 transform translate-y-0.5"></i>
                </button>
                <div class="flex-grow mr-2">
                    <input type="text" class="category-name font-bold text-gray-700 bg-transparent border-none outline-none w-full focus:ring-2 focus:ring-indigo-300 rounded px-1" value="">
                </div>
                <!-- Category Drag Handle (Right of Name) -->
                <div class="category-drag-handle text-gray-400 hover:text-gray-600 cursor-move px-2">
                    <i class="fas fa-grip-vertical"></i>
                </div>
                <!-- Add Task Button Header (Right of Name, visible when expanded) -->
                <button class="btn-add-task-header text-indigo-500 hover:text-indigo-700 transition px-2 hidden" title="Añadir Tarea">
                    <i class="fas fa-plus-circle fa-lg"></i>
                </button>
                <button class="btn-delete-category text-gray-400 hover:text-red-500 transition px-1 hidden delete-btn-large">
                    <i class="fas fa-trash fa-lg"></i>
                </button>
            </div>
            <!-- Task List Container -->
            <div class="task-list flex-grow p-2 overflow-y-auto min-h-[50px] space-y-2">
                <!-- Tasks will be injected here -->
            </div>
        </div>
    </template>

    <!-- Template for Task -->
    <template id="tpl-task">
        <div class="task-item bg-white rounded shadow-sm border border-gray-200 flex flex-col" data-id="">
            <div class="p-2 flex items-start">
                <!-- Task Drag Handle (Left of Name) -->
                <div class="task-drag-handle text-gray-400 hover:text-gray-600 cursor-move pr-2 pt-0.5">
                    <i class="fas fa-grip-vertical"></i>
                </div>
                <div class="flex-grow min-w-0 flex flex-col">
                    <div class="flex justify-between items-center mb-1">
                        <input type="text" class="task-name text-sm text-gray-800 w-full border-none p-0 focus:ring-0 bg-transparent" value="" placeholder="Nombre de la tarea">
                    </div>
                    <!-- Badges for extra info (Clickable to expand) -->
                    <div class="task-badges-container cursor-pointer p-1 -ml-1 rounded hover:bg-gray-50 flex items-center justify-between">
                        <div class="flex space-x-2 text-xs text-gray-500">
                            <span class="badge-counter" title="Veces realizada"><i class="fas fa-redo-alt mr-1"></i> <span class="counter-val">0</span></span>
                            <span class="badge-percentage" title="Progreso"><i class="fas fa-percent mr-1"></i> <span class="percentage-val">0</span>%</span>
                            <span class="badge-priority flex items-center" title="Prioridad">
                                <div class="priority-stars-container size-sm pointer-events-none"></div>
                            </span>
                            <span class="badge-forecast" title="Previsión (horas)"><i class="fas fa-clock mr-1 text-pink-500"></i> <span class="forecast-val">0.5</span>h</span>
                            <span class="badge-spent" title="Invertido (horas)"><i class="fas fa-hourglass-half mr-1 text-blue-500"></i> <span class="spent-val">0</span>h</span>
                            <span class="badge-note text-indigo-400 hidden" title="Tiene nota"><i class="fas fa-sticky-note"></i></span>
                        </div>
                        <i class="fas fa-chevron-down text-gray-300 text-xs expand-icon-indicator"></i>
                    </div>
                </div>
                <div class="flex items-center space-x-2 ml-2 pt-1">
                    <input type="checkbox" class="task-checkbox w-4 h-4 text-indigo-600 bg-gray-100 border-gray-300 rounded focus:ring-indigo-500 cursor-pointer">
                </div>
            </div>

            <!-- Expanded Area -->
            <div class="task-expanded hidden px-3 pb-3 pt-1 border-t border-gray-100 space-y-3 cursor-default bg-gray-50 rounded-b">
                <div class="flex items-center justify-between">
                    <label class="text-xs font-semibold text-gray-600">Contador</label>
                    <div class="flex items-center space-x-2">
                        <button class="btn-counter-dec w-6 h-6 rounded bg-gray-200 hover:bg-gray-300 flex items-center justify-center text-gray-600">-</button>
                        <input type="number" class="input-counter w-12 text-center text-sm border-gray-300 rounded px-1 py-0.5" value="0" min="0">
                        <button class="btn-counter-inc w-6 h-6 rounded bg-gray-200 hover:bg-gray-300 flex items-center justify-center text-gray-600">+</button>
                    </div>
                </div>
                <div class="flex items-center justify-between">
                    <label class="text-xs font-semibold text-gray-600">Previsión (h)</label>
                    <div class="flex items-center space-x-2">
                        <button class="btn-forecast-dec w-6 h-6 rounded bg-gray-200 hover:bg-gray-300 flex items-center justify-center text-gray-600">-</button>
                        <input type="number" class="input-forecast w-12 text-center text-sm border-gray-300 rounded px-1 py-0.5" value="0.5" min="0" step="0.5">
                        <button class="btn-forecast-inc w-6 h-6 rounded bg-gray-200 hover:bg-gray-300 flex items-center justify-center text-gray-600">+</button>
                    </div>
                </div>
                <div class="flex items-center justify-between">
                    <label class="text-xs font-semibold text-gray-600">Invertido (h)</label>
                    <div class="flex items-center space-x-2">
                        <button class="btn-spent-dec w-6 h-6 rounded bg-gray-200 hover:bg-gray-300 flex items-center justify-center text-gray-600">-</button>
                        <input type="number" class="input-spent w-12 text-center text-sm border-gray-300 rounded px-1 py-0.5" value="0" min="0" step="0.5">
                        <button class="btn-spent-inc w-6 h-6 rounded bg-gray-200 hover:bg-gray-300 flex items-center justify-center text-gray-600">+</button>
                    </div>
                </div>
                <div class="flex items-center justify-between pt-1 border-t border-gray-100">
                    <label class="text-xs font-semibold text-gray-600">Prioridad</label>
                    <div class="priority-stars-container size-md detail-priority-stars"></div>
                </div>
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="text-xs font-semibold text-gray-600">Progreso</label>
                        <span class="text-xs text-gray-500"><span class="label-percentage">0</span>%</span>
                    </div>
                    <input type="range" class="input-percentage w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer" min="0" max="100" value="0" step="5">
                </div>
                <div>
                    <label class="text-xs font-semibold text-gray-600 mb-1 block">Nota</label>
                    <textarea class="input-note w-full border border-gray-300 rounded p-2 text-sm focus:ring-indigo-500 focus:border-indigo-500" rows="2" placeholder="Añadir nota adicional..."></textarea>
                </div>

                <div class="flex flex-col space-y-1">
                    <label class="text-xs font-semibold text-gray-600">Anexo</label>
                    <div class="attachment-container">
                        <!-- Content will be injected by JS: placeholder or image -->
                    </div>
                </div>

                <!-- More Details & Delete -->
                <div class="flex justify-between items-start mt-2 border-t pt-2 border-gray-200">
                    <div class="flex flex-col space-y-2">
                        <button class="btn-delete-task text-gray-400 hover:text-red-500 transition" title="Borrar tarea">
                            <i class="fas fa-trash-alt fa-lg"></i>
                        </button>
                        <button class="btn-show-history flex items-center space-x-1 text-indigo-500 hover:text-indigo-700 transition hidden" title="Ver Historial">
                            <i class="fas fa-history"></i>
                            <span class="text-[10px] font-bold uppercase tracking-tight">Historial</span>
                        </button>
                    </div>
                    <details class="group text-sm">
                        <summary class="cursor-pointer font-semibold text-indigo-600 hover:text-indigo-800 text-xs flex items-center justify-end select-none">
                            Planificación
                            <i class="fas fa-plus-square ml-1 group-open:hidden"></i>
                            <i class="fas fa-minus-square ml-1 hidden group-open:inline-block"></i>
                        </summary>
                        <div class="mt-2 space-y-2 border-l-2 border-indigo-200 pl-2">
                            <div class="flex justify-between items-center">
                                <label class="text-xs text-gray-600">Fecha creación</label>
                                <input type="date" class="input-creation-date w-28 text-xs border-gray-300 rounded px-1 py-0.5">
                            </div>
                            <div class="flex justify-between items-center">
                                <label class="text-xs text-gray-600">Fecha fin</label>
                                <input type="date" class="input-end-date w-28 text-xs border-gray-300 rounded px-1 py-0.5">
                            </div>
                            <div class="flex justify-between items-center">
                                <label class="text-xs text-gray-600">Fecha previsto</label>
                                <input type="date" class="input-planned-date w-28 text-xs border-gray-300 rounded px-1 py-0.5">
                            </div>
                            <div class="flex justify-between items-center">
                                <label class="text-xs text-gray-600">Fecha iteración</label>
                                <input type="date" class="input-iteration-date w-28 text-xs border-gray-300 rounded px-1 py-0.5">
                            </div>
                            <div class="flex justify-between items-center">
                                <label class="text-xs text-gray-600">Reinicio (días)</label>
                                <input type="number" class="input-reset-days w-20 text-center text-xs border-gray-300 rounded px-1 py-0.5" value="0" min="0">
                            </div>
                        </div>
                    </details>
                </div>
        </div>
    </template>

    <script src="app.js"></script>
</body>
</html>
